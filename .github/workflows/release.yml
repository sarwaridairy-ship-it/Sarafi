name: SARAFI Release

on:
  workflow_dispatch:
    inputs:
      promote:
        description: 'Promote this exact commit to production after review'
        required: true
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run smoke
      - run: npx supabase db lint --local
      - run: npm run build

  production-promotion:
    if: ${{ inputs.promote == true }}
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Production promotion gate
        run: echo "Configure the protected hosting provider promotion for this exact verified commit."
