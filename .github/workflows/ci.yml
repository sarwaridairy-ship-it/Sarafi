name: SARAFI CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - name: Performance and import checks
        run: npm run performance:step18 && npm test -- src/domain/imports.test.ts
      - name: Check whether authenticated browser fixtures are configured
        id: authenticated_fixtures
        env:
          SARAFI_E2E_EMAIL: ${{ secrets.SARAFI_E2E_EMAIL }}
          SARAFI_E2E_PASSWORD: ${{ secrets.SARAFI_E2E_PASSWORD }}
          SARAFI_E2E_ORGANIZATION_ID: ${{ secrets.SARAFI_E2E_ORGANIZATION_ID }}
        run: |
          if [[ -n "$SARAFI_E2E_EMAIL" && -n "$SARAFI_E2E_PASSWORD" && -n "$SARAFI_E2E_ORGANIZATION_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticated security journeys
        if: steps.authenticated_fixtures.outputs.ready == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SARAFI_E2E_EMAIL: ${{ secrets.SARAFI_E2E_EMAIL }}
          SARAFI_E2E_PASSWORD: ${{ secrets.SARAFI_E2E_PASSWORD }}
          SARAFI_E2E_ORGANIZATION_ID: ${{ secrets.SARAFI_E2E_ORGANIZATION_ID }}
        run: npx playwright test tests/e2e/authenticated-security.spec.ts
