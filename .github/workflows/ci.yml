name: SARAFI CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SARAFI_EVIDENCE_STAGE: inspection
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - name: Performance and import checks
        run: npm run performance:step18 && npm test -- src/domain/imports.test.ts
      - name: Require authenticated browser fixtures
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SARAFI_E2E_EMAIL: ${{ secrets.SARAFI_E2E_EMAIL }}
          SARAFI_E2E_PASSWORD: ${{ secrets.SARAFI_E2E_PASSWORD }}
          SARAFI_E2E_ORGANIZATION_ID: ${{ secrets.SARAFI_E2E_ORGANIZATION_ID }}
          SARAFI_E2E_ROLE_FIXTURES: ${{ secrets.SARAFI_E2E_ROLE_FIXTURES }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          test -n "$SARAFI_E2E_EMAIL"
          test -n "$SARAFI_E2E_PASSWORD"
          test -n "$SARAFI_E2E_ORGANIZATION_ID"
          test -n "$SARAFI_E2E_ROLE_FIXTURES"
      - name: Authenticated security journeys
        env:
          SARAFI_EVIDENCE_STAGE: authenticated-security
          STEP15_CERTIFICATION: "true"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SARAFI_E2E_EMAIL: ${{ secrets.SARAFI_E2E_EMAIL }}
          SARAFI_E2E_PASSWORD: ${{ secrets.SARAFI_E2E_PASSWORD }}
          SARAFI_E2E_ORGANIZATION_ID: ${{ secrets.SARAFI_E2E_ORGANIZATION_ID }}
        run: npx playwright test --config=playwright.api.config.ts tests/e2e/authenticated-security.spec.ts
      - name: Authenticated seven-role contract
        env:
          SARAFI_EVIDENCE_STAGE: authenticated-roles
          STEP15_CERTIFICATION: "true"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SARAFI_E2E_ORGANIZATION_ID: ${{ secrets.SARAFI_E2E_ORGANIZATION_ID }}
          SARAFI_E2E_ROLE_FIXTURES: ${{ secrets.SARAFI_E2E_ROLE_FIXTURES }}
        run: npx playwright test --config=playwright.api.config.ts tests/e2e/authenticated-roles.spec.ts
      - name: Record evidence for this commit
        if: always()
        run: node scripts/write-evidence-manifest.mjs inspection authenticated-security authenticated-roles
      - name: Retain browser, PDF, screenshot, and trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarafi-ci-evidence-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            playwright-report/
            test-results/
            artifacts/
            output/pdf/
            evidence-results/
            release-evidence/test-manifest.json

  migration-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase init --yes
      - run: npx supabase start --yes
      - name: Replay the complete schema in an isolated database
        run: npx supabase db reset --local --no-seed
      - name: Reject database errors
        run: npx supabase db lint --local --level error --fail-on error
      - name: Stop isolated database
        if: always()
        run: npx supabase stop --no-backup
