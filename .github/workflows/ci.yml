name: SARAFI CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Authenticated security journeys
        if: ${{ secrets.SARAFI_E2E_EMAIL != '' && secrets.SARAFI_E2E_PASSWORD != '' && secrets.SARAFI_E2E_ORGANIZATION_ID != '' }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SARAFI_E2E_EMAIL: ${{ secrets.SARAFI_E2E_EMAIL }}
          SARAFI_E2E_PASSWORD: ${{ secrets.SARAFI_E2E_PASSWORD }}
          SARAFI_E2E_ORGANIZATION_ID: ${{ secrets.SARAFI_E2E_ORGANIZATION_ID }}
        run: npx playwright test tests/e2e/authenticated-security.spec.ts
