  <title>Sarafi - Dari App Opening</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914}
    body{display:grid;place-items:center}

    #paperLayer,#authPage{display:none}
    #skipOpening{position:fixed;z-index:3;top:max(18px,env(safe-area-inset-top));inset-inline-end:max(18px,env(safe-area-inset-right));min-width:68px;min-height:42px;padding:8px 16px;border:1px solid rgba(184,211,207,.38);border-radius:999px;color:#d5e8e4;background:rgba(2,9,20,.62);font:700 13px "Segoe UI",Tahoma,Arial,sans-serif;backdrop-filter:blur(10px);cursor:pointer}

    #openingProgress{position:fixed;z-index:3;right:50%;bottom:max(24px,env(safe-area-inset-bottom));width:min(42vw,180px);height:2px;overflow:hidden;transform:translateX(50%);border-radius:999px;background:rgba(185,213,207,.18)}
